server:
  # Hosting platforms assign the port through the PORT environment variable
  port: ${PORT:8080}
  # Behind the platform's HTTPS proxy, honor X-Forwarded-* so generated URLs (e.g. Swagger's server URL) use https
  forward-headers-strategy: framework

spring:
  application:
    name: starwars-api
  http:
    clients:
      # Bound calls to SWAPI so a slow/hung upstream cannot block request threads indefinitely
      connect-timeout: 5s
      read-timeout: 10s
  datasource:
    # Defaults match compose.yaml for local development; other environments override them with SPRING_DATASOURCE_*
    url: jdbc:postgresql://localhost:5432/starwars
    username: starwars
    password: starwars
    hikari:
      data-source-properties:
        # citext only compares case-insensitively when string parameters are not sent as varchar
        stringtype: unspecified
  cache:
  # Fixed list: a misspelled name in @Cacheable fails instead of silently creating an unconfigured cache
    cache-names: people-list, people-by-id, films-list, films-by-id, starships-list, starships-by-id, vehicles-list, vehicles-by-id, species-list, species-by-id, planets-list, planets-by-id
    caffeine:
      # SWAPI data is effectively static; the size bound keeps memory predictable on a 512 MB instance
      spec: maximumSize=500,expireAfterWrite=24h

swapi:
  base-url: https://www.swapi.tech/api

jwt:
  issuer: starwars-api
  expiration: 1h

auth:
  login-attempts:
    max-failures: 5
    block-duration: 15m

springdoc:
  swagger-ui:
    # Kept public on purpose: the interactive docs are the main way to try the deployed API
    enabled: true
