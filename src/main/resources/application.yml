spring:
  application:
    name: starwars-api
  http:
    clients:
      # Bound calls to SWAPI so a slow/hung upstream cannot block request threads indefinitely
      connect-timeout: 5s
      read-timeout: 10s

swapi:
  base-url: https://www.swapi.tech/api


springdoc:
  swagger-ui:
    # Kept public on purpose: the interactive docs are the main way to try the deployed API
    enabled: true
