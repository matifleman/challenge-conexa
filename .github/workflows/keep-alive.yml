name: Keep alive

on:
  schedule:
    # Every 10 minutes, Monday to Friday, 08:00-20:50 in Argentina (UTC-3):
    # Render's free plan suspends the service after 15 minutes without traffic
    - cron: "*/10 11-23 * * 1-5"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: true

# The job only makes an HTTP request, it does not read the repository
permissions: {}

jobs:
  ping:
    name: Ping health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The retries cover a cold start (around two minutes) when the service was already suspended
      - name: Ping
        env:
          HEALTH_URL: https://starwars-api-zdeq.onrender.com/actuator/health
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --max-time 60 --retry 4 --retry-delay 15 --retry-all-errors \
            "$HEALTH_URL"
